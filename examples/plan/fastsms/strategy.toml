[strategy]
name = "SMA Crossover"
project = "mock"
strategy_id = "sma"

[params]
timeframe = "1D"

[params."基本設定"]
symbol = "AAPL"
data_source = "yahoo"
start_date = "2018-01-01"
end_date = "2024-12-31"

[params."進場條件"]
fast_period = 10
slow_period = 30
signal_threshold = 0.001
confirm_bars = 1
volume_filter = true
min_volume = 500000

[params."出場條件"]
stop_loss = 0.08
take_profit = 0.25
trailing_stop = 0.05
max_hold_days = 120
exit_on_reverse = true

[params."部位與風控"]
position_size = 1.0
max_leverage = 1.0
cooldown_bars = 2
max_open_trades = 1
